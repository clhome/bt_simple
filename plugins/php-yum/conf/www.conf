[www]
user = {$PHP_USER}
group = {$PHP_GROUP}

listen = /var/opt/remi/php{$PHP_VERSION}/run/php-fpm/www.sock
listen.owner = {$PHP_USER}
listen.group = {$PHP_GROUP}
listen.backlog = 4096

pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
pm.status_path = /phpfpm_status_yum{$PHP_VERSION}
pm.max_requests = 1000
request_terminate_timeout = 30
request_slowlog_timeout = 10
slowlog = /var/opt/remi/php{$PHP_VERSION}/log/php-fpm/www-slow.log

php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/opt/remi/php{$PHP_VERSION}/log/php-fpm/error.log
php_value[auto_prepend_file] = {$SERVER_PATH}/php/app_start_yum.php

; 应急缓解（P0-3）：用 php_admin_value 锁定 memory_limit，保证应用层 ini_set 无法覆盖。
; 512M 是默认档位，可在面板「应急缓解」里切换 128M/256M/512M/1G/-1（-1 = 不限制，需二次确认）。
; 注意：php_admin_value 优先级高于 php.ini 的 memory_limit，面板里改 ini 的这个键对它无效。
php_admin_value[memory_limit] = 512M
