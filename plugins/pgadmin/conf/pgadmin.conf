server
{
    listen 5051;
    server_name 127.0.0.1;

    # 模板版本号：仅用于让 index.py 判断已安装的 vhost 是否需要刷新，勿手工修改
    # PGADMIN_VHOST_TPL_VERSION = 3

    # 注意：这里刻意不配置 root / index。
    # 本 vhost 的所有请求都走 location / 反代到 pgAdmin，
    # 而 {$SERVER_PATH}/pgadmin 下存放着 cfg.json（含明文口令）与 pg.pass（Basic Auth 口令文件），
    # 一旦日后有人加一个静态 location，这些文件就会直接对外可读。

    #AUTH_START
    auth_basic "Authorization";
    auth_basic_user_file {$SERVER_PATH}/pgadmin/pg.pass;
    #AUTH_END

    location / {
        proxy_pass http://unix:/tmp/pgadmin4.sock;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
        # 剥离 Basic Auth 头，避免被 pgAdmin 当成外部认证信息误用
        proxy_set_header Authorization "";
        proxy_redirect off;

        # pgAdmin v9.8+ 返回 Cross-Origin-Opener-Policy: same-origin（CVE-2025-9636），
        # 在 HTTP 反代环境下会被浏览器忽略并打印告警，且可能干扰登录跳转链路。
        # 在 Nginx 层直接剥离，即使 config_local.py 的配置未生效也能兜住。
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;

        # pgAdmin 的备份/恢复/导入会 POST 整个 dump 文件，Nginx 默认 1m 会直接 413
        client_max_body_size 1024m;
        # 大表导出/长事务超过默认 60s 会被网关掐断，表现为“连接已断开”
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }

    access_log  {$SERVER_PATH}/pgadmin/access.log;
    error_log  {$SERVER_PATH}/pgadmin/error.log;
}
