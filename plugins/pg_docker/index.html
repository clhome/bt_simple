<style>
    #con-deploy > .bt-form-con > .line > .tname {
        width: 150px;
        white-space: nowrap;
        text-align: left;
    }
    #con-deploy > .bt-form-con > .line > .info-r {
        margin-left: 150px;
    }
    
    /* 修复左侧菜单随页面滚动的排版 */
    .bt-form, .bt-w-main {
        height: 100%;
    }
    .bt-w-main {
        display: flex;
    }
    .bt-w-menu {
        float: none !important;
        height: 100%;
    }
    .bt-w-con {
        flex: 1;
        height: 100%;
        overflow-y: auto;
        margin-left: 0 !important;
    }
</style>
<div class="bt-form">
	<div class="bt-w-main">
		<div class="bt-w-menu">
			<p class="bgw" onclick="switchTab('list');">实例列表</p>
			<p onclick="switchTab('deploy');">部署新实例</p>
		</div>
		<div class="bt-w-con pd15">
			<div class="plugin-con" id="con-list">
                <div class="divtable">
                    <table class="table table-hover" width="100%" cellspacing="0" cellpadding="0" border="0">
                        <thead>
                            <tr>
                                <th style="text-align: left; width: 15%;">实例名称</th>
                                <th style="text-align: left; width: 10%;">运行状态</th>
                                <th style="text-align: left; width: 10%;">映射端口</th>
                                <th style="text-align: left; width: 15%;">数据库名</th>
                                <th style="text-align: left; width: 25%;">实例目录</th>
                                <th style="text-align: right; width: 30%;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="pg-instance-list">
                            <!-- JS动态渲染 -->
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="plugin-con" id="con-deploy" style="display: none; height: 100%; overflow-y: auto;">
                <div class="bt-form-con">
                    <div class="line">
                        <span class="tname"><i class="glyphicon glyphicon-tag" style="margin-right: 5px; color: #666;"></i>实例名称</span>
                        <div class="info-r">
                            <input type="text" class="bt-input-text mr5" name="inst_name" placeholder="例如: mall, 只能使用字母数字下划线" style="width: 250px;">
                            <div class="c9" style="margin-top: 5px; line-height: 20px;">容器名将被设为 pg-[实例名]，用于严格隔离</div>
                        </div>
                    </div>
                    <div class="line">
                        <span class="tname"><i class="glyphicon glyphicon-folder-open" style="margin-right: 5px; color: #666;"></i>基础存放目录</span>
                        <div class="info-r">
                            <input type="text" class="bt-input-text mr5" name="base_dir" value="/docker_data" style="width: 250px;">
                            <div class="c9" style="margin-top: 5px; line-height: 20px;">默认 /docker_data，该实例数据将存放在基础目录/[实例名]/ 下</div>
                        </div>
                    </div>
                    <div class="line">
                        <span class="tname"><i class="glyphicon glyphicon-user" style="margin-right: 5px; color: #666;"></i>数据库用户名</span>
                        <div class="info-r">
                            <input type="text" class="bt-input-text mr5" name="db_user" placeholder="请输入数据库用户名" style="width: 250px;">
                        </div>
                    </div>
                    <div class="line">
                        <span class="tname"><i class="glyphicon glyphicon-lock" style="margin-right: 5px; color: #666;"></i>数据库密码</span>
                        <div class="info-r" style="display: flex; align-items: center;">
                            <input type="text" class="bt-input-text mr5" name="db_pass" placeholder="建议使用复杂密码" style="width: 250px;">
                            <span class="glyphicon glyphicon-random cursor" onclick="generateRandomPassword()" title="随机生成密码" style="color: #20a53a; font-size: 16px; margin-left: 5px;"></span>
                        </div>
                    </div>
                    <div class="line">
                        <span class="tname"><i class="glyphicon glyphicon-hdd" style="margin-right: 5px; color: #666;"></i>默认数据库名</span>
                        <div class="info-r">
                            <input type="text" class="bt-input-text mr5" name="db_name" placeholder="请输入数据库名" style="width: 250px;">
                        </div>
                    </div>
                    <div class="line">
                        <span class="tname"><i class="glyphicon glyphicon-resize-horizontal" style="margin-right: 5px; color: #666;"></i>宿主机端口</span>
                        <div class="info-r">
                            <input type="number" class="bt-input-text mr5" name="port" placeholder="请输入对外映射的TCP端口号" style="width: 250px;">
                            <div class="c9" style="margin-top: 5px; line-height: 20px;">确保不与服务器已用端口冲突</div>
                        </div>
                    </div>
                    
                    <div class="line">
                        <span class="tname"><i class="glyphicon glyphicon-floppy-disk" style="margin-right: 5px; color: #666;"></i>硬盘类型</span>
                        <div class="info-r">
                            <select class="bt-input-text mr5" name="disk_type" style="width: 250px;">
                                <option value="ssd">固态硬盘/NVMe (推荐)</option>
                                <option value="hdd_single">机械硬盘单片</option>
                                <option value="hdd_raid">普通阵列硬盘</option>
                            </select>
                            <div class="c9" style="margin-top: 5px; line-height: 20px;">影响磁盘随机读写预估成本参数 (random_page_cost)</div>
                        </div>
                    </div>
                    
                    <div class="line">
                        <span class="tname"><i class="glyphicon glyphicon-briefcase" style="margin-right: 5px; color: #666;"></i>业务场景</span>
                        <div class="info-r">
                            <select class="bt-input-text mr5" name="scenario" style="width: 250px;">
                                <option value="general">通用场景 (安全与性能均衡)</option>
                                <option value="high_concurrency">高并发报表 (读多写少，分配更多工作内存)</option>
                                <option value="high_throughput">高吞吐日志/IoT (关闭同步提交，极致写入性能)</option>
                            </select>
                        </div>
                    </div>

                    <div class="line">
                        <span class="tname"><i class="glyphicon glyphicon-dashboard" style="margin-right: 5px; color: #666;"></i>内存上限(MB)</span>
                        <div class="info-r">
                            <input type="number" class="bt-input-text mr5" name="mem_limit" placeholder="留空则按服务器总内存自动计算" style="width: 250px;">
                            <div class="c9" style="margin-top: 5px; line-height: 20px;">强制不超过服务器总内存 75%，共享缓存等参数将基于此自动推算</div>
                        </div>
                    </div>

                    <hr style="margin: 20px 0; border: 0; border-top: 1px dashed #ddd;">
                    <div class="line">
                        <span class="tname" style="font-weight: bold; color: #333;"><i class="glyphicon glyphicon-time" style="margin-right: 5px; color: #333;"></i>自动备份</span>
                        <div class="info-r">
                            <div class="c9" style="margin-top: 5px; line-height: 20px;">每日凌晨 2 点自动对实例进行全量备份</div>
                        </div>
                    </div>
                    <div class="line">
                        <span class="tname">日备份保留天数</span>
                        <div class="info-r">
                            <input type="number" class="bt-input-text mr5" name="daily_retention" value="7" style="width: 250px;">
                        </div>
                    </div>
                    <div class="line">
                        <span class="tname">周保留备份天数</span>
                        <div class="info-r">
                            <input type="number" class="bt-input-text mr5" name="weekly_retention" value="30" style="width: 250px;">
                        </div>
                    </div>
                    
                    <div class="line" style="margin-top: 20px;">
                        <span class="tname"></span>
                        <div class="info-r">
                            <button class="btn btn-success btn-sm" onclick="deployInstance()">提交部署配置</button>
                        </div>
                    </div>
                </div>
            </div>
		</div>
	</div>
</div>

<script type="text/javascript">
resetPluginWinHeight(650);

function pgPost(method, args, callback) {
    var req_data = {
        name: 'pg_docker',
        func: method,
        version: '',
        args: JSON.stringify(args || {})
    };

    $.post('/plugins/run', req_data, function(data) {
        if(typeof(callback) == 'function'){
            callback(data);
        }
    }, 'json').fail(function() {
        layer.msg('请求失败', {icon: 2});
    });
}

function switchTab(tab) {
    $('.bt-w-menu p').removeClass('bgw');
    $('.plugin-con').hide();
    
    if (tab === 'list') {
        $('.bt-w-menu p:eq(0)').addClass('bgw');
        $('#con-list').show();
        loadList();
    } else {
        $('.bt-w-menu p:eq(1)').addClass('bgw');
        $('#con-deploy').show();
    }
}

function loadList() {
    var loadT = layer.msg('正在获取实例列表...', { icon: 16, time: 0, shade: 0.3 });
    pgPost('get_list', {}, function(resp) {
        layer.close(loadT);
        if (!resp.status) {
            layer.msg(resp.msg, { icon: 2 });
            return;
        }
        var data = resp.data;
        if (typeof data === 'string') {
            try { data = JSON.parse(data); } catch(e) {}
        }
        
        // 面板的插件运行接口会二次包装 JSON，这里需要解开真实的数据数组
        if (data && data.data !== undefined) {
            data = data.data;
        }
        if (!Array.isArray(data)) data = [];

        var html = '';
        if (data.length === 0) {
            html = '<tr><td colspan="6" style="text-align:center; padding: 30px 0; color: #999;">暂无任何 PostgreSQL Docker 实例，请前往“部署新实例”创建</td></tr>';
        } else {
            for (var i = 0; i < data.length; i++) {
                var item = data[i];
                var statusIcon = item.status 
                    ? '<span style="color: #20a53a; font-weight: bold; cursor: pointer;" onclick="toggleStatus(\''+item.name+'\', \'stop\')" title="点击停止实例"><i class="glyphicon glyphicon-play-circle" style="margin-right: 3px;"></i>运行中</span>' 
                    : '<span style="color: red; font-weight: bold; cursor: pointer;" onclick="toggleStatus(\''+item.name+'\', \'start\')" title="点击启动实例"><i class="glyphicon glyphicon-ban-circle" style="margin-right: 3px;"></i>已停止</span>';
                html += '<tr>' +
                    '<td style="font-weight: bold; color: #333;">' + item.name + '</td>' +
                    '<td>' + statusIcon + '</td>' +
                    '<td><code style="background: #f1f1f1; padding: 2px 5px; border-radius: 3px; color: #e6522c;">' + item.port + '</code></td>' +
                    '<td><span style="color: #666;">' + item.dbname + '</span></td>' +
                    '<td><span style="color: #999; font-size: 12px;">' + item.path + '</span></td>' +
                    '<td style="text-align: right;">' +
                        '<a href="javascript:;" class="btlink" style="margin-right: 10px;" onclick="showConfig(\''+item.name+'\')"><i class="glyphicon glyphicon-list-alt" style="margin-right: 3px;"></i>详细配置</a>' +
                        '<a href="javascript:;" class="btlink" style="color: red;" onclick="uninstallInstance(\''+item.name+'\', \''+item.path+'\')">卸载实例</a>' +
                    '</td>' +
                '</tr>';
            }
        }
        $('#pg-instance-list').html(html);
    });
}

function deployInstance() {
    var args = {
        instance_name: $('input[name="inst_name"]').val(),
        base_dir: $('input[name="base_dir"]').val(),
        db_user: $('input[name="db_user"]').val(),
        db_pass: $('input[name="db_pass"]').val(),
        db_name: $('input[name="db_name"]').val(),
        port: $('input[name="port"]').val(),
        disk_type: $('select[name="disk_type"]').val(),
        scenario: $('select[name="scenario"]').val(),
        mem_limit: $('input[name="mem_limit"]').val(),
        daily_retention: $('input[name="daily_retention"]').val(),
        weekly_retention: $('input[name="weekly_retention"]').val()
    };
    
    if (!args.instance_name || !args.db_user || !args.db_pass || !args.db_name) {
        layer.msg('所有带输入框的字段都必须填写完整', {icon: 2});
        return;
    }
    
    var reg = /^[a-zA-Z0-9_]+$/;
    if (!reg.test(args.instance_name)) {
        layer.msg('实例名称只能使用字母、数字、下划线', {icon: 2});
        return;
    }

    var loadT = layer.msg('正在渲染模板并拉起容器，这可能需要1-3分钟...', { icon: 16, time: 0, shade: 0.3 });
    pgPost('create_instance', args, function(resp) {
        layer.close(loadT);
        var resData = resp;
        if(typeof resp.data === 'string') {
            try { resData = JSON.parse(resp.data); } catch(e){}
        }
        
        layer.msg(resData.msg || resp.msg, { icon: resp.status ? 1 : 2, time: 3000 });
        if (resp.status) {
            // 清空表单
            $('input[name="inst_name"]').val('');
            switchTab('list');
        }
    });
}

function showConfig(name) {
    var loadT = layer.msg('正在获取配置...', { icon: 16, time: 0, shade: 0.3 });
    pgPost('get_config', { instance_name: name }, function(resp) {
        layer.close(loadT);
        var data = resp.data;
        if (typeof data === 'string') {
            try { data = JSON.parse(data); } catch(e){}
        }
        if (data && data.data !== undefined) {
            data = data.data;
        }
        if (!resp.status && (!data || data.status === false)) {
            layer.msg(data && data.msg ? data.msg : resp.msg, { icon: 2 });
            return;
        }
        var content = typeof data === 'object' ? data.data : data;
        
        layer.open({
            type: 1,
            title: '实例 [' + name + '] 配置详情 (docker-compose.yml)',
            area: ['700px', '750px'],
            closeBtn: 1,
            shadeClose: true,
            content: '<div style="padding: 15px;"><pre style="background: #272822; color: #f8f8f2; padding: 15px; border-radius: 5px; height: 650px; overflow-y: auto; font-family: Consolas, monospace;">' + content + '</pre></div>'
        });
    });
}

function toggleStatus(name, action) {
    var actionName = action === 'start' ? '启动' : '停止';
    layer.confirm('确定要'+actionName+'实例 ['+name+'] 吗？', {
        title: '状态切换确认',
        btn: ['确定', '取消']
    }, function() {
        var loadT = layer.msg('正在'+actionName+'...', { icon: 16, time: 0, shade: 0.3 });
        pgPost('toggle_status', { instance_name: name, action: action }, function(resp) {
            layer.close(loadT);
            var resData = resp;
            if (typeof resp.data === 'string') {
                try { resData = JSON.parse(resp.data); } catch(e){}
            }
            
            layer.msg(resData.msg || resp.msg, { icon: (resData.status || resp.status) ? 1 : 2 });
            if (resData.status || resp.status) {
                loadList();
            }
        });
    });
}

function uninstallInstance(name, path) {
    layer.open({
        type: 1,
        title: '卸载 PostgreSQL 实例',
        area: '400px',
        closeBtn: 1,
        shadeClose: true,
        content: '<div style="padding: 20px;">' +
            '<p style="color: red; font-weight: bold;">注意：此操作将停止并移除容器 <code>pg-'+name+'</code>，以及清理所有的定时备份任务！</p>' +
            '<div style="margin-top: 20px;">' +
                '<label><input type="checkbox" id="del_data_cb" value="1"> 彻底删除挂载的卷和配置数据 ('+path+')</label>' +
            '</div>' +
            '<div style="margin-top: 10px; color: #999; font-size: 12px;">强烈建议勾选前先确保所有重要数据已备份。</div>' +
            '<div style="margin-top: 20px; text-align: center;">' +
                '<button class="btn btn-danger btn-sm" onclick="doUninstall(\''+name+'\', \''+path+'\')">确认卸载</button>' +
            '</div>' +
        '</div>'
    });
}

function doUninstall(name, path) {
    var keep_data = !$('#del_data_cb').is(':checked');
    layer.closeAll();
    var loadT = layer.msg('正在卸载实例...', { icon: 16, time: 0, shade: 0.3 });
    
    // 从 path 推算 base_dir
    var base_dir = path.substring(0, path.lastIndexOf('/'));
    
    pgPost('uninstall_instance', { instance_name: name, keep_data: keep_data, base_dir: base_dir }, function(resp) {
        layer.close(loadT);
        var resData = resp;
        if(typeof resp.data === 'string') {
            try { resData = JSON.parse(resp.data); } catch(e){}
        }
        layer.msg(resData.msg || resp.msg, { icon: resp.status ? 1 : 2 });
        if (resp.status) {
            loadList();
        }
    });
}

// 随机生成 8-12 位乱序密码
function generateRandomPassword() {
    var length = Math.floor(Math.random() * 5) + 8; // 8 - 12
    var charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#_-";
    var retVal = "";
    for (var i = 0, n = charset.length; i < length; ++i) {
        retVal += charset.charAt(Math.floor(Math.random() * n));
    }
    $("input[name='db_pass']").val(retVal);
}

// 自动拉宽所在的 layui-layer 弹窗以适配表单宽度
var layuiLayer = $('.bt-form').closest('.layui-layer');
if(layuiLayer.length > 0 && layuiLayer.width() < 950) {
    layuiLayer.css('width', '950px');
    var left = ($(window).width() - 950) / 2;
    layuiLayer.css('left', left + 'px');
}

// 实例名称联动数据库用户名和数据库名
$("input[name='inst_name']").on('input', function() {
    var val = $(this).val();
    $("input[name='db_user']").val(val);
    $("input[name='db_name']").val(val);
});

// 初始化
loadList();
</script>
