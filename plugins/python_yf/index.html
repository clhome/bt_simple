<style>
.py-version-card { border: 1px solid #eee; border-radius: 8px; padding: 15px; margin-bottom: 15px; background: #fff; box-shadow: 0 2px 12px 0 rgba(0,0,0,.05); transition: all 0.3s; }
.py-version-card:hover { box-shadow: 0 4px 16px 0 rgba(0,0,0,.1); border-color: #e4e7ed; }
.py-version-card h3 { margin: 0 0 10px 0; font-size: 18px; color: #333; }
.py-version-card p { margin: 0 0 10px 0; font-size: 13px; color: #666; }
.py-version-card .bt-btn { float: right; margin-top: -30px; }
.py-list-container { max-height: 540px; overflow-y: auto; padding-right: 10px; }
.py-list-container::-webkit-scrollbar { width: 6px; }
.py-list-container::-webkit-scrollbar-thumb { background: #e2e2e2; border-radius: 4px; }
</style>
<div class="bt-form">
    <div class="bt-w-main">
        <div class="bt-w-menu">
            <p class="bgw" onclick="py_yf.show_installed()">已安装版本</p>
            <p onclick="py_yf.show_available()">可用版本</p>
        </div>
        <div class="bt-w-con pd15">
            <div class="plugin_body">
                <div class="py-list-container" id="py_yf_list">
                    <div style="text-align:center; padding:50px 0;"><img src="/static/img/loading.gif"> 正在获取版本信息...</div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
if(typeof resetPluginWinWidth === 'function'){ resetPluginWinWidth(750); }
resetPluginWinHeight(620);

var py_yf = {
    plugin_name: 'python_yf',
    cache_data: null,
    
    init: function() {
        this.get_list();
        $('.bt-w-menu p').click(function(){
            $(this).addClass('bgw').siblings().removeClass('bgw');
        });
    },
    
    request: function(func, args, callback) {
        var loadT = layer.msg('正在处理,请稍候...', {icon: 16, time: 0, shade: [0.3, '#000']});
        $.post('/plugins/run', {name: this.plugin_name, func: func, args: JSON.stringify(args)}, function(res){
            layer.close(loadT);
            if(typeof(res) === 'string') {
                try { res = JSON.parse(res); } catch(e) {}
            }
            
            var script_res = res;
            if(res && res.status === true && typeof(res.data) === 'string') {
                try { script_res = JSON.parse(res.data); } catch(e) {}
            }
            
            if(callback) callback(script_res);
        });
    },
    
    get_list: function() {
        var _this = this;
        this.request('get_python_list', {}, function(res){
            if(!res.status) {
                layer.msg(res.msg, {icon:2, time:3000});
                return;
            }
            _this.cache_data = res.data;
            // 每次刷新重新判断当前选中的是哪个 tab
            if($('.bt-w-menu p:eq(1)').hasClass('bgw')){
                _this.show_available();
            } else {
                _this.show_installed();
            }
        });
    },
    
    show_installed: function() {
        if(!this.cache_data) return;
        var html = '';
        var list = this.cache_data.installed;
        if(list.length === 0) {
            html = '<div style="text-align:center; padding:50px 0; color:#999;">暂未通过 uv 安装任何 Python 版本</div>';
        } else {
            for(var i=0; i<list.length; i++) {
                var item = list[i];
                var btn_html = '<div style="float:right; margin-top: -2px;">';
                btn_html += '<button class="btn btn-success btn-sm" onclick="py_yf.create_venv_dialog(\'' + item.name + '\')">创建虚拟环境</button>';
                // 仅允许卸载 uv 目录下的 Python，保护系统自带环境
                if(item.path.indexOf('/uv/python') !== -1 || item.path.indexOf('.local/share/uv') !== -1) {
                    if(item.venvs && item.venvs.length > 0) {
                        btn_html += '<button class="btn btn-default btn-sm" style="margin-left:10px;" disabled title="存在关联的虚拟环境，为了安全禁止卸载">卸载</button>';
                    } else {
                        btn_html += '<button class="btn btn-danger btn-sm" style="margin-left:10px;" onclick="py_yf.uninstall(\'' + item.name + '\')">卸载</button>';
                    }
                } else {
                    btn_html += '<button class="btn btn-default btn-sm" style="margin-left:10px;" disabled title="系统自带或其他外部环境，为防止系统崩溃，禁止卸载">系统环境</button>';
                }
                btn_html += '</div>';
                
                var venv_info = '';
                if(item.venvs && item.venvs.length > 0) {
                    venv_info += '<div style="margin-top:10px; padding-top:10px; border-top:1px dashed #eee;">';
                    venv_info += '<p style="font-size:12px; color:#20a53a; font-weight:bold; margin-bottom:5px;">已创建虚拟环境 (' + item.venvs.length + ')</p>';
                    for(var j=0; j<item.venvs.length; j++) {
                        var v_path = item.venvs[j];
                        var v_path_parts = v_path.split('/');
                        var v_name = v_path_parts.pop();
                        var p_path = v_path_parts.join('/') || '/';
                        var copy_cmd = "cd " + p_path + " && source " + v_name + "/bin/activate";
                        venv_info += '<div style="font-size:12px; margin-bottom:4px; display:flex; justify-content:space-between; align-items:center;">' +
                                     '<div><span class="glyphicon glyphicon-link" style="color:#aaa;margin-right:5px;font-size:11px;"></span>' + 
                                     '<a href="javascript:;" onclick="openPath(\'' + v_path + '\')" class="btlink" style="background:#f9f9f9;padding:2px 5px;border-radius:4px;" title="打开目录">' + v_path + '</a></div>' +
                                     '<div><a href="javascript:;" onclick="copyPass(\'' + copy_cmd + '\')" style="color:#20a53a; margin-right:10px; cursor:pointer;" title="复制应用虚拟环境的命令">应用环境命令</a>' +
                                     '<a href="javascript:;" onclick="py_yf.remove_venv(\'' + item.name + '\', \'' + v_path + '\')" style="color:#d9534f; cursor:pointer;" title="删除该虚拟环境">删除</a></div>' +
                                     '</div>';
                    }
                    venv_info += '</div>';
                }
                
                html += '<div class="py-version-card">' +
                        btn_html +
                        '<h3>' + item.version + ' <span style="font-size:13px; color:#666; font-weight:normal; margin-left:10px;">(标识: ' + item.name + ')</span></h3>' +
                        '<p style="margin-top:8px;">路径: <span style="background:#f5f5f5;padding:2px 5px;border-radius:4px;user-select:all;">' + item.path + '</span></p>' +
                        venv_info + 
                        '</div>';
            }
        }
        $('#py_yf_list').html(html);
    },
    
    show_available: function() {
        if(!this.cache_data) return;
        var list = this.cache_data.all_versions || this.cache_data.available;
        var html = '';
        if(!list || list.length === 0) {
            html = '<div style="text-align:center; padding:50px 0; color:#999;">无可用版本</div>';
        } else {
            for(var i=0; i<list.length; i++) {
                var item = list[i];
                var is_installed = (item.path && item.path !== '');
                
                var btn_html = '<div style="float:right; margin-top: -2px;">';
                if(is_installed) {
                    if(item.path.indexOf('/uv/python') !== -1 || item.path.indexOf('.local/share/uv') !== -1) {
                        if(item.venvs && item.venvs.length > 0) {
                            btn_html += '<button class="btn btn-default btn-sm" disabled title="存在关联的虚拟环境，为了安全禁止卸载">卸载</button>';
                        } else {
                            btn_html += '<button class="btn btn-danger btn-sm" onclick="py_yf.uninstall(\'' + item.name + '\')">卸载</button>';
                        }
                    } else {
                        btn_html += '<button class="btn btn-default btn-sm" disabled title="系统环境">已安装</button>';
                    }
                } else {
                    btn_html += '<button class="btn btn-success btn-sm" onclick="py_yf.install(\'' + item.name + '\')">一键安装</button>';
                }
                btn_html += '</div>';
                
                html += '<div class="py-version-card" style="padding:15px;">' +
                        btn_html +
                        '<h3 style="margin:0;">' + item.version + ' <span style="font-size:13px; color:#666; font-weight:normal; margin-left:10px;">(标识: ' + item.name + ')</span></h3>' +
                        '</div>';
            }
        }
        $('#py_yf_list').html(html);
    },
    
    install: function(version_name) {
        var _this = this;
        layer.confirm('确定要安装 [' + version_name + '] 吗？安装过程可能需要几十秒时间，请耐心等待。', {title: '安装 Python', icon:3}, function(index){
            layer.close(index);
            _this.request('install_python', {version: version_name}, function(res){
                layer.msg(res.msg, {icon: res.status ? 1 : 2, time: 3000});
                if(res.status) {
                    _this.get_list(); // 刷新列表
                }
            });
        });
    },
    
    uninstall: function(version_name) {
        var _this = this;
        layer.confirm('确定要卸载 [' + version_name + '] 吗？', {title: '卸载 Python', icon:3}, function(index){
            layer.close(index);
            _this.request('uninstall_python', {version: version_name}, function(res){
                layer.msg(res.msg, {icon: res.status ? 1 : 2, time: 3000});
                if(res.status) {
                    _this.get_list();
                }
            });
        });
    },
    
    remove_venv: function(version_name, path) {
        var _this = this;
        layer.confirm('确定要删除虚拟环境目录 [' + path + '] 吗？此操作将不可恢复！', {title: '删除虚拟环境', icon:3}, function(index){
            layer.close(index);
            var loadT = layer.msg('正在删除,请稍候...', {icon: 16, time: 0, shade: [0.3, '#000']});
            _this.request('remove_venv', {version: version_name, path: path}, function(res){
                layer.close(loadT);
                layer.msg(res.msg, {icon: res.status ? 1 : 2, time: 3000});
                if(res.status) {
                    _this.get_list();
                }
            });
        });
    },
    
    create_venv_dialog: function(version_name) {
        var _this = this;
        var html = '<div class="pd15"><div class="bt-form">' +
            '<div class="line">' +
            '<span class="tname">环境路径</span>' +
            '<div class="info-r">' +
            '<input id="venv_path_input" class="bt-input-text mr5" type="text" style="width:300px" placeholder="请选择或输入您的项目根目录" />' +
            '<span class="glyphicon glyphicon-folder-open cursor" onclick="changePath(\'venv_path_input\')"></span>' +
            '<p class="info" style="margin-top:10px; color:#666;">例如: /www/wwwroot/my_project (系统将自动在此目录下创建 .venv 文件夹)</p>' +
            '</div></div></div></div>';
        
        layer.open({
            type: 1,
            title: '创建 [' + version_name + '] 的虚拟环境',
            area: '500px',
            content: html,
            btn: ['创建', '取消'],
            yes: function(index) {
                var path = $('#venv_path_input').val();
                if(!path) { layer.msg('请输入虚拟环境路径', {icon:2}); return; }
                
                var loadT = layer.msg('正在创建虚拟环境,请稍候...', {icon: 16, time: 0, shade: [0.3, '#000']});
                _this.request('create_venv', {version: version_name, path: path}, function(res){
                    layer.close(loadT);
                    layer.msg(res.msg, {icon: res.status?1:2});
                    if(res.status) {
                        layer.close(index);
                        _this.get_list();
                    }
                });
            }
        });
    }
};

py_yf.init();
</script>
