[www]
user = {$PHP_USER}
group = {$PHP_GROUP}

listen = /run/php/php{$PHP_VERSION}-fpm.sock
listen.owner = {$PHP_USER}
listen.group = {$PHP_GROUP}
listen.mode = 0666
listen.backlog = 4096

pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.status_path = /phpfpm_status_apt{$PHP_VERSION}
pm.max_requests = 1000

request_terminate_timeout = 60
request_slowlog_timeout = 10
slowlog = /var/log/fpm-php{$PHP_VERSION}.www.slow.log

catch_workers_output = yes
clear_env = no

php_value[auto_prepend_file] = {$SERVER_PATH}/php/app_start_apt.php

; 应急缓解（P0-3）：用 php_admin_value 锁定 memory_limit，保证应用层 ini_set 无法覆盖。
; 512M 是默认档位，可在面板「应急缓解」里切换 128M/256M/512M/1G/-1（-1 = 不限制，需二次确认）。
; 注意：php_admin_value 优先级高于 php.ini 的 memory_limit，面板里改 ini 的这个键对它无效。
php_admin_value[memory_limit] = 512M
