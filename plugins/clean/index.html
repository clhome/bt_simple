<script type="text/javascript">
var pt = (window.YfI18n && typeof window.YfI18n.createPluginTranslator === 'function') 
    ? window.YfI18n.createPluginTranslator('clean') 
    : function(k) { return k; };

// 扩展弹窗高度与宽度，保证首屏“disk check”一屏完整呈现，无垂直滚动条
resetPluginWinWidth(980);
resetPluginWinHeight(720);

// 初始化翻译左侧菜单栏，并赋予 tooltip
$('.bt-w-menu p').each(function() {
    var $txt = $(this).find('.tab-txt');
    var raw = $txt.text().trim();
    if (raw) {
        var trans = pt(raw);
        $txt.text(trans);
        $(this).attr('title', trans);
    }
});

// API 请求封装
function cleanApi(func, args, callback) {
    var req_data = {
        name: 'clean',
        func: func,
        version: '',
        args: JSON.stringify(args || {})
    };

    $.post('/plugins/run', req_data, function(resp) {
        var rdata = resp;
        if (typeof resp.data === 'string') {
            try {
                rdata = JSON.parse(resp.data);
            } catch(e) {}
        }
        if (typeof callback === 'function') {
            callback(rdata);
        }
    }, 'json').fail(function() {
        layer.msg(pt('网络请求失败'), { icon: 2 });
    });
}

function switchCleanTab(tabName, elem) {
    $('.bt-w-menu p').removeClass('bgw');
    $(elem).addClass('bgw');

    if (tabName === 'overview') {
        renderOverviewTab();
    } else if (tabName === 'top_logs') {
        renderTopLogsTab();
    } else if (tabName === 'strategy') {
        renderStrategyTab();
    } else if (tabName === 'history') {
        renderHistoryTab();
    } else if (tabName === 'service') {
        renderServiceTab();
    } else if (tabName === 'readme') {
        renderReadmeTab();
    }
}

// ---------------- 1. 空间体检与瘦身 Tab ----------------
var currentScanData = null;

function renderOverviewTab() {
    var html = '<div style="margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;">\
        <h4 style="margin:0; font-size:16px; font-weight:700; color:#1e293b;">' + pt('磁盘空间占用体检与清理') + '</h4>\
        <div>\
            <button class="btn btn-default btn-sm" onclick="renderOverviewTab()"><i class="glyphicon glyphicon-refresh"></i> ' + pt('重新扫描') + '</button>\
        </div>\
    </div>\
    <div id="overview-loading" style="text-align:center; padding:50px 0; color:#64748b;"><i class="fa fa-spinner fa-spin fa-2x"></i><p style="margin-top:10px;">' + pt('正在深度体检全盘日志与缓存占用...') + '</p></div>\
    <div id="overview-content" style="display:none;"></div>';

    $('#clean-content-body').html(html);

    cleanApi('get_scan_overview', {}, function(res) {
        $('#overview-loading').hide();
        $('#overview-content').show();

        if (!res.status) {
            $('#overview-content').html('<div class="alert alert-danger">' + res.msg + '</div>');
            return;
        }

        currentScanData = res.data;
        var d = res.data;

        // 统计总可清理
        var totalCleanable = 0;
        var totalProtected = 0;
        for (var k in d.categories) {
            totalCleanable += d.categories[k].cleanable_size;
            totalProtected += d.categories[k].protected_count;
        }

        var viewHtml = '\
        <div class="clean-stat-grid">\
            <div class="clean-stat-card">\
                <div class="card-title">' + pt('日志与缓存总占用') + '</div>\
                <div class="card-val">' + d.total_size_format + '</div>\
                <div class="card-sub">' + pt('共扫描') + ' ' + d.total_files + ' ' + pt('个日志文件') + '</div>\
            </div>\
            <div class="clean-stat-card card-highlight">\
                <div class="card-title">' + pt('建议可瘦身空间') + '</div>\
                <div class="card-val" id="total-cleanable-val">' + (totalCleanable > 0 ? formatBytes(totalCleanable) : '0 B') + '</div>\
                <div class="card-sub">' + pt('截断活跃大日志 + 清除过期归档') + '</div>\
            </div>\
            <div class="clean-stat-card card-shield">\
                <div class="card-title">' + pt('安全合规受控保护') + '</div>\
                <div class="card-val">' + totalProtected + ' <span style="font-size:13px;font-weight:normal;">' + pt('项') + '</span></div>\
                <div class="card-sub">' + pt('等保 2.0 / CIS 核心审计文件免受误删') + '</div>\
            </div>\
        </div>\
        \
        <table class="clean-cat-table">\
            <thead>\
                <tr>\
                    <th style="width:40px;"><input type="checkbox" id="check-all-cats" checked onchange="toggleSelectAll(this)"></th>\
                    <th style="width:220px;">' + pt('日志类别') + '</th>\
                    <th>' + pt('包含范围说明') + '</th>\
                    <th style="width:110px;text-align:right;">' + pt('当前占用') + '</th>\
                    <th style="width:110px;text-align:right;">' + pt('可瘦身') + '</th>\
                </tr>\
            </thead>\
            <tbody>';

        for (var catKey in d.categories) {
            var cat = d.categories[catKey];
            viewHtml += '\
                <tr>\
                    <td><input type="checkbox" class="cat-checkbox" value="' + catKey + '" checked onchange="updateSelectedCleanable()"></td>\
                    <td><strong style="color:#0f172a;">' + pt(cat.name) + '</strong></td>\
                    <td style="color:#64748b;font-size:12px;">' + pt(cat.desc) + '</td>\
                    <td style="text-align:right;"><span class="clean-badge clean-badge-gray">' + cat.total_size_format + '</span></td>\
                    <td style="text-align:right;"><span class="clean-badge clean-badge-green">' + cat.cleanable_size_format + '</span></td>\
                </tr>';
        }

        viewHtml += '\
            </tbody>\
        </table>\
        \
        <div class="clean-action-bar">\
            <div style="display:flex; align-items:center; gap:16px;">\
                <label style="margin:0; font-size:13px; font-weight:normal; color:#475569;">\
                    ' + pt('历史归档保留') + ':\
                    <select id="clean-retention-select" class="form-control input-sm" style="display:inline-block; width:100px; margin-left:6px;">\
                        <option value="7" selected>7 ' + pt('天前') + '</option>\
                        <option value="15">15 ' + pt('天前') + '</option>\
                        <option value="30">30 ' + pt('天前') + '</option>\
                        <option value="60">60 ' + pt('天前') + '</option>\
                    </select>\
                </label>\
                <label style="margin:0; font-size:13px; font-weight:normal; color:#475569;">\
                    <input type="checkbox" id="clean-journal-chk" checked> ' + pt('清理 Systemd Journal (保留100M)') + '\
                </label>\
            </div>\
            <div>\
                <button class="btn clean-btn-primary" onclick="startCleanAction()"><i class="glyphicon glyphicon-trash" style="margin-right:6px;"></i> ' + pt('开始安全瘦身') + '</button>\
            </div>\
        </div>';

        $('#overview-content').html(viewHtml);
    });
}

function formatBytes(bytes) {
    if (bytes === 0) return '0 B';
    var k = 1024;
    var sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
    var i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

function toggleSelectAll(elem) {
    $('.cat-checkbox').prop('checked', $(elem).is(':checked'));
    updateSelectedCleanable();
}

function updateSelectedCleanable() {
    if (!currentScanData) return;
    var sum = 0;
    $('.cat-checkbox:checked').each(function() {
        var key = $(this).val();
        if (currentScanData.categories[key]) {
            sum += currentScanData.categories[key].cleanable_size;
        }
    });
    $('#total-cleanable-val').text(formatBytes(sum));
}

function startCleanAction() {
    var selected = [];
    $('.cat-checkbox:checked').each(function() {
        selected.push($(this).val());
    });

    if (selected.length === 0) {
        layer.msg(pt('请至少勾选一个需要清理的日志分类'), { icon: 0 });
        return;
    }

    var retentionDays = $('#clean-retention-select').val();
    var cleanJournal = $('#clean-journal-chk').is(':checked');

    layer.confirm(pt('确定开始执行安全清理？') + '<br><small style="color:#64748b;">' + pt('将安全截断所选活跃日志，并删除已归档超过 ') + retentionDays + pt(' 天的历史压缩包。<br>核心安全审计日志严格保护，无 Inode 泄露风险。') + '</small>', {
        title: pt('安全瘦身确认'),
        icon: 3
    }, function(index) {
        layer.close(index);
        var loadT = layer.msg(pt('正在执行安全瘦身与日志截断...'), { icon: 16, time: 0, shade: 0.3 });

        cleanApi('do_clean', {
            categories: selected,
            retention_days: retentionDays,
            truncate_active: true,
            delete_rotated: true,
            clean_journal: cleanJournal,
            clean_pkg_cache: true
        }, function(resp) {
            layer.close(loadT);
            if (resp.status) {
                var r = resp.data;
                var msgHtml = '<div style="padding:15px 20px;">\
                    <h4 style="color:#16a34a; margin-top:0;"><i class="glyphicon glyphicon-ok-circle"></i> ' + pt('清理执行成功！') + '</h4>\
                    <p style="font-size:14px; margin-bottom:8px;">' + pt('成功释放空间') + ': <strong style="color:#16a34a; font-size:18px;">' + r.freed_format + '</strong></p>\
                    <p style="font-size:12px; color:#64748b; margin-bottom:4px;">' + pt('处理日志文件数') + ': ' + r.cleaned_files + ' ' + pt('个') + ' / ' + pt('扫描总数') + ': ' + r.scanned_files + '</p>\
                    <p style="font-size:12px; color:#64748b;">' + pt('安全审计合规跳过') + ': ' + r.skipped_protected + ' ' + pt('项') + ' (等保保护)</p>\
                </div>';

                layer.open({
                    type: 1,
                    title: pt('瘦身完成战报'),
                    area: ['380px', '220px'],
                    content: msgHtml,
                    btn: [pt('确定')],
                    yes: function(i) {
                        layer.close(i);
                        renderOverviewTab();
                    }
                });
            } else {
                layer.msg(resp.msg, { icon: 2 });
            }
        });
    });
}

// ---------------- 2. Top 10 大文件榜 Tab ----------------
function renderTopLogsTab() {
    var html = '<div style="margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;">\
        <div>\
            <h4 style="margin:0; font-size:16px; font-weight:700; color:#1e293b;">' + pt('Top 10 巨型日志大文件榜单') + '</h4>\
            <p style="margin:4px 0 0 0; font-size:12px; color:#64748b;">' + pt('精准揪出磁盘吞噬者，支持单文件即时截断清零') + '</p>\
        </div>\
        <div>\
            <button class="btn btn-default btn-sm" onclick="renderTopLogsTab()"><i class="glyphicon glyphicon-refresh"></i> ' + pt('刷新排行') + '</button>\
        </div>\
    </div>\
    <div id="toplogs-loading" style="text-align:center; padding:50px 0; color:#64748b;"><i class="fa fa-spinner fa-spin fa-2x"></i><p style="margin-top:10px;">' + pt('正在检索大日志文件...') + '</p></div>\
    <div id="toplogs-content" style="display:none;"></div>';

    $('#clean-content-body').html(html);

    cleanApi('get_top_logs', {}, function(res) {
        $('#toplogs-loading').hide();
        $('#toplogs-content').show();

        if (!res.status) {
            $('#toplogs-content').html('<div class="alert alert-danger">' + res.msg + '</div>');
            return;
        }

        var list = res.data;
        if (!list || list.length === 0) {
            $('#toplogs-content').html('<div style="text-align:center; padding:40px; color:#94a3b8;">' + pt('未发现占用过大的日志文件，系统状态良好！') + '</div>');
            return;
        }

        var tHtml = '<table class="clean-cat-table">\
            <thead>\
                <tr>\
                    <th style="width:40px;">#</th>\
                    <th>' + pt('日志文件名 / 路径') + '</th>\
                    <th style="width:100px;text-align:right;">' + pt('文件大小') + '</th>\
                    <th style="width:150px;">' + pt('最后修改时间') + '</th>\
                    <th style="width:100px;text-align:center;">' + pt('操作') + '</th>\
                </tr>\
            </thead>\
            <tbody>';

        for (var i = 0; i < list.length; i++) {
            var item = list[i];
            var actionBtn = '';
            if (item.is_protected) {
                actionBtn = '<span class="clean-badge clean-badge-blue" title="' + pt('等保安全审计要求，禁止直接删除') + '"><i class="glyphicon glyphicon-lock"></i> ' + pt('等保受控') + '</span>';
            } else {
                actionBtn = '<button class="btn btn-xs btn-warning" onclick="truncateSingleFile(\'' + escape(item.path) + '\')">' + pt('截断清零') + '</button>';
            }

            tHtml += '<tr>\
                <td style="color:#94a3b8; font-weight:bold;">' + (i + 1) + '</td>\
                <td>\
                    <div style="font-weight:600; color:#0f172a;">' + item.name + '</div>\
                    <div style="font-size:11px; color:#94a3b8; word-break:break-all;">' + item.path + '</div>\
                </td>\
                <td style="text-align:right;"><span class="clean-badge clean-badge-green">' + item.size_format + '</span></td>\
                <td style="font-size:12px; color:#64748b;">' + item.mtime + '</td>\
                <td style="text-align:center;">' + actionBtn + '</td>\
            </tr>';
        }

        tHtml += '</tbody></table>';
        $('#toplogs-content').html(tHtml);
    });
}

function truncateSingleFile(encodedPath) {
    var realPath = unescape(encodedPath);
    layer.confirm(pt('确定立即将该日志文件截断清零？') + '<br><small style="color:#e11d48; word-break:break-all;">' + realPath + '</small><br><small style="color:#64748b;">' + pt('大小将置为 0，保留文件句柄与权限，不会中断服务。') + '</small>', {
        title: pt('单文件截断清零'),
        icon: 3
    }, function(index) {
        layer.close(index);
        var loadT = layer.msg(pt('正在截断文件...'), { icon: 16, time: 0, shade: 0.3 });
        cleanApi('do_truncate_file', { path: realPath }, function(res) {
            layer.close(loadT);
            if (res.status) {
                layer.msg(res.msg, { icon: 1 });
                renderTopLogsTab();
            } else {
                layer.msg(res.msg, { icon: 2 });
            }
        });
    });
}

// ---------------- 3. 自动清理策略 Tab ----------------
function renderStrategyTab() {
    var html = '<div style="margin-bottom:18px;">\
        <h4 style="margin:0; font-size:16px; font-weight:700; color:#1e293b;">' + pt('自动清理与轮转策略设置') + '</h4>\
        <p style="margin:4px 0 0 0; font-size:12px; color:#64748b;">' + pt('利用面板计划任务系统，低峰期全自动清理过期历史归档与大日志截断') + '</p>\
    </div>\
    <div id="strategy-loading" style="text-align:center; padding:40px 0;"><i class="fa fa-spinner fa-spin fa-2x"></i></div>\
    <div id="strategy-form" style="display:none;"></div>';

    $('#clean-content-body').html(html);

function changePeriodUI(val) {
    if (val === 'day-n') {
        $('#cfg_where1_group').show();
    } else {
        $('#cfg_where1_group').hide();
    }
}

function saveStrategyConfig() {
    var enable = $('input[name="strategy_enable"]:checked').val() === '1';
    var period = $('#cfg_period_select').val();
    var where1 = $('#cfg_where1').val();
    var hour = $('#cfg_hour').val();
    var minute = $('#cfg_minute').val();
    var retentionDays = $('#cfg_retention_days').val();
    var cleanJournal = $('#cfg_clean_journal').is(':checked');
    var cleanPkgCache = $('#cfg_clean_pkg_cache').is(':checked');

    var loadT = layer.msg(pt('正在应用配置...'), { icon: 16, time: 0, shade: 0.3 });
    cleanApi('save_task_config', {
        enable: enable,
        period: period,
        where1: where1,
        hour: hour,
        minute: minute,
        retention_days: retentionDays,
        clean_journal: cleanJournal,
        clean_pkg_cache: cleanPkgCache
    }, function(res) {
        layer.close(loadT);
        if (res.status) {
            layer.msg(res.msg, { icon: 1 });
            renderStrategyTab();
        } else {
            layer.msg(res.msg, { icon: 2 });
        }
    });
}

// ---------------- 4. 清理战报与历史 Tab ----------------
function renderHistoryTab() {

        </div>\
    </div>\

    <div id="history-content" style="display:none;"></div>';

    $('#clean-content-body').html(html);

    cleanApi('get_history', {}, function(res) {
        $('#history-loading').hide();
        $('#history-content').show();

        if (!res.status) {
            $('#history-content').html('<div class="alert alert-danger">' + res.msg + '</div>');
            return;
        }

        var list = res.data;
        if (!list || list.length === 0) {
            $('#history-content').html('<div style="text-align:center; padding:40px; color:#94a3b8;">' + pt('暂无历史清理记录') + '</div>');

        }

        var tHtml = '<table class="clean-cat-table">\
            <thead>\
                <tr>\
                    <th style="width:160px;">' + pt('执行时间') + '</th>\
                    <th style="width:100px;">' + pt('释放空间') + '</th>\
                    <th style="width:90px;">' + pt('处理文件数') + '</th>\
                    <th style="width:80px;">' + pt('耗时') + '</th>\
                    <th>' + pt('等保跳过保护') + '</th>\
                    <th style="width:90px;text-align:center;">' + pt('详情') + '</th>\
                </tr>\
            </thead>\
            <tbody>';

        for (var i = 0; i < list.length; i++) {
            var item = list[i];
            tHtml += '<tr>\
                <td style="color:#0f172a; font-weight:500;">' + item.time + '</td>\
                <td><strong style="color:#16a34a;">' + item.freed_format + '</strong></td>\
                <td>' + item.cleaned_files + ' ' + pt('个') + '</td>\
                <td style="color:#64748b;">' + (item.duration_seconds || 0) + 's</td>\
                <td><span class="clean-badge clean-badge-blue">' + (item.skipped_protected || 0) + ' ' + pt('项受控') + '</span></td>\
                <td style="text-align:center;"><button class="btn btn-xs btn-default" onclick="showHistoryDetail(' + i + ')">' + pt('查看明细') + '</button></td>\
            </tr>';

function showHistoryDetail(index) {
    if (!window._historyCache || !window._historyCache[index]) return;
    var rec = window._historyCache[index];
    var details = rec.details || [];

    var dHtml = '<div style="padding:16px 20px; max-height:480px; overflow-y:auto;">';
    
    // 汇总指标卡片
    dHtml += '<div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:6px; padding:12px 16px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;">\
        <div>\
            <div style="font-size:12px; color:#64748b;">' + pt('实际累计释放总容量') + '</div>\
            <div style="font-size:20px; font-weight:700; color:#16a34a; margin-top:2px;">' + rec.freed_format + '</div>\
        </div>\
        <div style="text-align:right;">\
            <div style="font-size:12px; color:#64748b;">' + pt('累计处理文件数') + '</div>\
            <div style="font-size:15px; font-weight:600; color:#334155; margin-top:2px;">' + rec.cleaned_files + ' ' + pt('个') + ' <span style="font-size:12px; color:#94a3b8;">(' + pt('扫描') + ' ' + rec.scanned_files + ')</span></div>\
        </div>\
    </div>';

    if (details.length === 0) {
        dHtml += '<p style="color:#94a3b8; text-align:center; padding:20px 0;">' + pt('无详细文件变动记录') + '</p>';
    } else {
        dHtml += '<div style="margin-bottom:8px; font-size:12px; color:#64748b; display:flex; justify-content:space-between;">\
            <span>' + pt('已按单文件释放容量降序排列（展示前') + ' ' + details.length + ' ' + pt('项高释放明细）：') + '</span>\
            ' + (rec.cleaned_files > details.length ? '<span style="color:#94a3b8;">' + pt('其余微小文件已汇总入总容量') + '</span>' : '') + '\
        </div>';
        dHtml += '<table class="table table-striped table-condensed" style="font-size:12px; margin-bottom:0;">\
            <thead><tr><th style="width:50px;">' + pt('动作') + '</th><th>' + pt('文件路径') + '</th><th style="width:90px; text-align:right;">' + pt('释放') + '</th></tr></thead>\
            <tbody>';
        for (var j = 0; j < details.length; j++) {
            var d = details[j];
            dHtml += '<tr>\
                <td><span class="label label-' + (d.action === 'truncate' ? 'warning' : 'danger') + '">' + (d.action === 'truncate' ? pt('截断') : pt('删除')) + '</span></td>\
                <td style="word-break:break-all; font-family:Consolas, monospace; font-size:11px;">' + d.path + '</td>\
                <td style="text-align:right; font-weight:600; color:#16a34a;">' + d.freed_format + '</td>\
            </tr>';
        }
        dHtml += '</tbody></table>';
    }
    dHtml += '</div>';

    layer.open({
        type: 1,
        title: pt('清理明细') + ' - ' + rec.time,
        area: ['650px', '500px'],
        content: dHtml
    });
}

                        <div style="font-size:12px; color:#64748b; margin-top:2px;">' + (isActive ? pt('后台定时守护已就绪，将在指定周期自动执行磁盘瘦身') : pt('计划任务未激活，不会进行自动清理')) + '</div>\
                    </div>\
                </div>\
                <div style="display:flex; gap:10px;">\
                    ' + (isActive ? '\

        </div>\
        \

function fetchServiceLog() {
    $('#clean-run-log-pre').text(pt('正在拉取日志...'));
    cleanApi('get_run_log', {}, function(res) {
        if (res.status && res.data) {
            $('#clean-run-log-pre').text(res.data);
            var pre = document.getElementById('clean-run-log-pre');
            if (pre) pre.scrollTop = pre.scrollHeight;
        } else {
            $('#clean-run-log-pre').text(pt('暂无日志记录'));
        }
    });
}

function clearServiceLog() {
    layer.confirm(pt('确定清空运行日志文件？'), { title: pt('提示'), icon: 3 }, function(i) {
        layer.close(i);
        cleanApi('clear_run_log', {}, function(res) {
            layer.msg(res.msg, { icon: res.status ? 1 : 2 });
            fetchServiceLog();
        });
    });
}

function toggleCleanService(action) {
    var loadT = layer.msg(pt('正在操作服务...'), { icon: 16, time: 0, shade: 0.3 });
    cleanApi(action, {}, function(res) {
        layer.close(loadT);
        layer.msg(pt('操作完成'), { icon: 1 });
        renderServiceTab();
    });
}

function triggerCleanNow() {
    layer.confirm(pt('确定立即在后台触发执行一次全自动清理？'), { title: pt('触发执行'), icon: 3 }, function(i) {
        layer.close(i);
        var loadT = layer.msg(pt('正在执行清理任务...'), { icon: 16, time: 0, shade: 0.3 });
        cleanApi('clean_run', {}, function(res) {
            layer.close(loadT);
            layer.msg(res.msg, { icon: res.status ? 1 : 2 });
            renderServiceTab();
        });
    });
}
