name: 供应链安全扫描

# H4：依赖漏洞（CVE）+ Python 安全静态扫描 + SBOM。
#
# 独立于构建/发布 workflow，理由：
#   * 发布链路不应因为「新披露了一个 CVE」而突然卡住（那是运维决策，不是代码问题）；
#   * 但 PR 与定时巡检必须能看到，且**高危必须阻断**。
#
# 分级口径（刻意保守，避免变成噪音门禁）：
#   pip-audit  -> 阻断。真实 CVE，误报率低；确有不可修复项时写进 security/audit-ignore.txt 并注明理由。
#   bandit     -> 只阻断 **HIGH**（-lll）。中低危先以报告形式积累，避免一上来几百条导致门禁被无视。
#   ruff       -> 仅报告（--exit-zero）。规则收紧前不阻断。
#
# 首次运行若变红，那是扫描器在干活：按报告 triage 后再合并，不要直接把 job 改成 continue-on-error。
#
# 触发范围必须覆盖被扫描的目录：bandit 扫的是 `web scripts panel_task.py panel_tools.py`，
# 所以 `paths` 里也得有 `scripts/**.py`（2026-10-13 补）。此前缺这一条，导致
# `scripts/tools/build_edition.py` 的 B202(HIGH) 在多次提交里都没被扫到，
# 直到某次同时改了 `web/**` 才暴雷 —— 扫描范围与触发范围不一致 = 漏扫。
#
# 关于 `文档/待审核插件`（2026-10-23 政策变更，P2-11 的扫描范围已撤）：
#   该目录已整目录打包为 `文档/待审核插件.7z`，源码树不再入库；那批代码不会再被使用，
#   只作为后续开发的参考件。**参考件不进生产 ⇒ 也不进扫描门禁**：7z 不是可执行代码，
#   把它留在 bandit 的 `-r` 里只是「扫不存在的目录」的假覆盖，留在 `paths` 里更是噪音
#   （改压缩包触发一次全量扫描，却什么代码都扫不到，还挤占配额）。
#   出口只有一条：**要上线的插件落进 `plugins/` 就自动被扫**（`plugins/**/*.py` 本来
#   就在 paths 与 bandit 目标里）。转正流程见 `文档/插件转正检查单.md`；
#   守卫见 `testsuite/test_pending_plugins_scan_scope.py`（已随政策改写）。

on:
  push:
    branches: [master, main, i18n]
    paths:
      - 'requirements*.txt'
      - 'web/**.py'
      - 'scripts/**.py'
      - 'plugins/**/*.py'
      - 'panel_task.py'
      - 'panel_tools.py'
      - '.github/workflows/security-scan.yml'
  pull_request:
    paths:
      - 'requirements*.txt'
      - 'web/**.py'
      - 'scripts/**.py'
      - 'plugins/**/*.py'
      - 'panel_task.py'
      - 'panel_tools.py'
      - '.github/workflows/security-scan.yml'
  schedule:
    # 每周一 03:00 UTC 巡检（CVE 随时可能新披露，不能只靠 PR 触发）
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: 依赖漏洞扫描（pip-audit）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装扫描器
        run: pip install --no-cache-dir "pip-audit>=2.7.0"
      - name: 扫描 requirements.txt
        run: |
          set -e
          ARGS=""
          if [ -f security/audit-ignore.txt ]; then
            while read -r vuln; do
              [ -z "$vuln" ] && continue
              case "$vuln" in \#*) continue;; esac
              ARGS="$ARGS --ignore-vuln $vuln"
            done < security/audit-ignore.txt
          fi
          echo "pip-audit $ARGS"
          pip-audit -r requirements.txt --strict $ARGS

  bandit-scan:
    name: 安全静态扫描（bandit / 仅阻断 HIGH）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --no-cache-dir "bandit>=1.7.5"
      - name: bandit（HIGH 阻断）
        run: |
          set -e
          bandit -r web scripts panel_task.py panel_tools.py \
            -x testsuite,test,node_modules,.git \
            -lll \
            -f txt
      - name: bandit（全量报告，不阻断）
        if: always()
        run: |
          bandit -r web scripts panel_task.py panel_tools.py \
            -x testsuite,test,node_modules,.git \
            -f json -o bandit-report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

  ruff-report:
    name: 静态检查（ruff / 仅报告）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --no-cache-dir "ruff>=0.4.0"
      # 起步阶段只看 E9/F 类（语法与未定义名），不引入风格规则
      - run: ruff check web scripts panel_task.py panel_tools.py --select E9,F --exit-zero

  sbom:
    name: 生成 SBOM（Release 附件用）
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --no-cache-dir "cyclonedx-bom>=4.1.0"
      - name: 生成 CycloneDX SBOM
        run: |
          set -e
          pip install --no-cache-dir -r requirements.txt
          cyclonedx-py environment -o sbom.json --output-format json
          ls -lh sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  lock:
    name: 生成带哈希的依赖锁文件（requirements.lock，H4.1）
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 为何放在 CI：生成带哈希的锁需要联网跑 pip-compile，开发机长期离线（见 task.md H4.1）。
      # 产物只作 artifact 供维护者审核后提交；**绝不作为唯一安装路径** ——
      # 安装脚本仍以 requirements.txt 为准（大陆网络 / 离线场景必须可装）。
      - run: pip install --no-cache-dir "pip-tools>=7.4.0"
      - name: pip-compile --generate-hashes
        run: |
          set -e
          pip-compile --generate-hashes --resolver=backtracking \
            --output-file requirements.lock requirements.txt
          ls -lh requirements.lock
      - uses: actions/upload-artifact@v4
        with:
          name: requirements-lock
          path: requirements.lock
