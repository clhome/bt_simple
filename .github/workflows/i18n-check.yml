# i18n 静态校验门禁
#
# 独立于上游 MW 的构建/发布 workflow（python-app-*.yml / release.yml），
# 只做 i18n 静态检查，失败不影响发布链路。
#
# 检查项见 scripts/verify_i18n.py（共 12 项）：插件/全局键集一致、译文无 HTML、
# 无脏键、无多参 pt()、msgTpl 首参含 pt(、无 {0} 占位符、后端消息前缀不含 HTML、
# 后端中文消息可查到语言包键（插件段 + `web/**/*.py` 段，web 段走棘轮基线
# scripts/i18n_web_backend_baseline.txt）、二级弹窗钩子、被引用键无空白/中文泄漏/
# 机翻拼接、语言包无空值键。
#
# 触发范围里的 `web/**/*.py`：web 后端（returnData/returnJson/returnMsg）的中文
# 消息也在门禁视野内，只改 web 后端而不触发检查等于把这层检查白写。
#
# 脚本自包含（仅标准库 + 内嵌自证夹具），不依赖被 .gitignore 忽略的 test/。

name: i18n Check

on:
  workflow_dispatch:
  push:
    paths:
      - 'plugins/**/lang/**'
      - 'plugins/**/*.js'
      - 'plugins/**/index.html'
      - 'plugins/**/index.py'
      - 'web/static/language/**'
      - 'web/static/app/i18n.js'
      - 'web/static/app/public.js'
      - 'web/**/*.py'
      - 'scripts/verify_i18n.py'
      - '.github/workflows/i18n-check.yml'
  pull_request:
    paths:
      - 'plugins/**/lang/**'
      - 'plugins/**/*.js'
      - 'plugins/**/index.html'
      - 'plugins/**/index.py'
      - 'web/static/language/**'
      - 'web/static/app/i18n.js'
      - 'web/static/app/public.js'
      - 'web/**/*.py'
      - 'scripts/verify_i18n.py'
      - '.github/workflows/i18n-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: 校验检测器本身（已知答案自证）
        run: python scripts/verify_i18n.py --self-test

      - name: 运行 i18n 静态校验
        run: python scripts/verify_i18n.py --verbose
