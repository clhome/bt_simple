# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: MW APP OpenResty

# 触发策略（报告 P1 第 9 条：CI 自动化程度低）：保留手动触发，另加 push / PR 自动触发，
# 但用 paths 收窄到「本插件目录 + 本 workflow 文件」。依据：这个 workflow 的实际动作是
# `sudo bash scripts/install_dev.sh` 装整套面板，再用
# `plugins/openresty/install.sh install 1.27.1` **真编译安装一次 OpenResty**，
# 属重型集成冒烟（编译耗时长）。只有 OpenResty 插件本体或本 workflow 自身改动
# 才可能影响它的结论。
# 守卫：testsuite/test_ci_workflows_hardening.py
on:
  workflow_dispatch:
  push:
    paths:
      - 'plugins/openresty/**'
      - '.github/workflows/python-app-op.yml'
  pull_request:
    paths:
      - 'plugins/openresty/**'
      - '.github/workflows/python-app-op.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    #runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install MW
      run: |
        sudo bash scripts/install_dev.sh
    - name: Install OpenResty
      run: |
        cd /www/server/mdserver-web/plugins/openresty && sudo bash install.sh install 1.27.1
    - name: Start DEBUG
      run: |
        cd /www/server/mdserver-web/web && sudo ../bin/python3 -m gunicorn -c setting.py app:app
        cd /www/server/mdserver-web && sudo ./bin/python3 panel_task.py &
