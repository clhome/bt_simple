# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: YF APP OpenResty

# 触发策略（报告 P1 第 9 条：CI 自动化程度低）：保留手动触发，另加 push / PR 自动触发，
# 但用 paths 收窄到「本插件目录 + 本 workflow 文件」。依据：这个 workflow 的实际动作是
# `sudo bash scripts/install_dev.sh` 装整套面板，再用
# `plugins/openresty/install.sh install 1.27.1` **真编译安装一次 OpenResty**，
# 属重型集成冒烟（编译耗时长）。只有 OpenResty 插件本体或本 workflow 自身改动
# 才可能影响它的结论。
# 守卫：testsuite/test_ci_workflows_hardening.py
on:
  workflow_dispatch:
  push:
    paths:
      - 'plugins/openresty/**'
      - '.github/workflows/python-app-op.yml'
  pull_request:
    paths:
      - 'plugins/openresty/**'
      - '.github/workflows/python-app-op.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        # 2026-10-23：原为 `ubuntu-latest`。GitHub 已公告该标签自 2026-10-19 起迁移到
        # Ubuntu 26.04，而 README「⚠️ 待适配 / 未验证」里写明 26.04 的工具链分支、
        # t64 库名（libaio1 → libaio1t64）、ondrej/sury 第三方源都还没验证 ——
        # 源码编译 PHP / OpenResty 在这种未适配系统上失败是必然的。
        # 冒烟类 workflow 一律钉 compatibility.md 已验证矩阵里的具体版本
        # （与 MySQL 四件套对齐）；26.04 适配完成、并用 workflow_dispatch 单独跑通过
        # 之后再把它加回矩阵，不要再用 `ubuntu-latest` 赌平台漂移。
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    #runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install YFPanel
      run: |
        sudo bash scripts/install_dev.sh
    - name: Install OpenResty
      run: |
        cd /www/server/yufeng_panel/plugins/openresty && sudo bash install.sh install 1.27.1
    # 冒烟：面板必须真的「在跑 + 能应答」才算绿，不是「敲了启动命令就算绿」。
    #
    # 旧写法有两处致命点（2026-10-23 的运行：MySQL55/56/57 的 Start DEBUG 全部退出码 127）：
    #   ① `cd web` 是相对路径，依赖 runner 的当前目录 —— 而当前目录是 checkout 目录，
    #      不是面板目录 /www/server/yufeng_panel；
    #   ② 裸 `gunicorn` 不在 PATH 上 —— 面板的 Python 环境在 /www/server/yufeng_panel/bin
    #      （venv，由 scripts/lib.sh 创建），setup-python 装出来的解释器里没有 gunicorn，
    #      于是 command not found。
    # 另外 setting.py 里是 `daemon=True`：启动命令 double-fork 后立刻返回 0，
    # 「命令没报错」不代表进程活着（端口占用之类的失败都发生在子进程里）。所以这里只认
    # `/healthz` 真的回 200 —— 它同时校验面板库结构完整 + data 目录可写
    # （见 web/admin/__init__.py::healthz），比 `ps` 断言更难糊弄。
    # 后台任务队列（panel_task.py）已由 install_dev.sh → cli.sh start 拉起过一次，
    # 这里不再重复启动，避免两个任务循环抢同一份锁。
    - name: 面板健康冒烟（/healthz）
      run: |
        set -e
        PANEL=/www/server/yufeng_panel
        if ! sudo test -f "$PANEL/data/port.pl"; then
          echo "::error::找不到 $PANEL/data/port.pl —— 面板从未成功启动过"
          exit 1
        fi
        PORT=$(sudo cat "$PANEL/data/port.pl")
        echo "面板端口：$PORT"
        for i in $(seq 1 60); do
          : > /tmp/yf_healthz.json
          code=$(curl -s -o /tmp/yf_healthz.json -w '%{http_code}' --max-time 5 "http://127.0.0.1:${PORT}/healthz") || code=000
          if [ "$code" = "200" ]; then
            cat /tmp/yf_healthz.json
            echo
            echo "面板健康检查通过（第 ${i} 次探测，HTTP 200）"
            exit 0
          fi
          echo "第 ${i} 次探测：HTTP ${code} $(cat /tmp/yf_healthz.json 2>/dev/null)"
          sleep 1
        done
        echo "::error::面板端口 ${PORT} 在 60s 内没有通过 /healthz（最后一次 HTTP ${code}）"
        sudo tail -n 60 "$PANEL/logs/panel_error.log" || echo "（读不到 panel_error.log）"
        exit 1
