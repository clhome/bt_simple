# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: MW APP PHP

# 触发策略（报告 P1 第 9 条：CI 自动化程度低）：保留手动触发，另加 push / PR 自动触发，
# 但用 paths 收窄到「本插件目录 + 本 workflow 文件」。依据：这个 workflow 的实际动作是
# `sudo bash scripts/install_dev.sh` 装整套面板，再用 `plugins/php/install.sh install NN`
# **逐个真装 11 个 PHP 版本**（53~81），是本仓库最重的集成冒烟。只有 PHP 插件本体或
# 本 workflow 自身改动才可能影响它的结论。
# 守卫：testsuite/test_ci_workflows_hardening.py
on:
  workflow_dispatch:
  push:
    paths:
      - 'plugins/php/**'
      - '.github/workflows/python-app-php.yml'
  pull_request:
    paths:
      - 'plugins/php/**'
      - '.github/workflows/python-app-php.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    #runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install MW
      run: |
        sudo bash scripts/install_dev.sh
    - name: Install PHP53
      run: |
        cd /www/server/mdserver-web/plugins/php && sudo bash install.sh install 53
    - name: Install PHP54
      run: |
        cd /www/server/mdserver-web/plugins/php && sudo bash install.sh install 54
    - name: Install PHP55
      run: |
        cd /www/server/mdserver-web/plugins/php && sudo bash install.sh install 55
    - name: Install PHP56
      run: |
        cd /www/server/mdserver-web/plugins/php && sudo bash install.sh install 56
    - name: Install PHP70
      run: |
        cd /www/server/mdserver-web/plugins/php && sudo bash install.sh install 70
    - name: Install PHP71
      run: |
        cd /www/server/mdserver-web/plugins/php && sudo bash install.sh install 71
    - name: Install PHP72
      run: |
        cd /www/server/mdserver-web/plugins/php && sudo bash install.sh install 72
    - name: Install PHP73
      run: |
        cd /www/server/mdserver-web/plugins/php && sudo bash install.sh install 73
    - name: Install PHP74
      run: |
        cd /www/server/mdserver-web/plugins/php && sudo bash install.sh install 74
    - name: Install PHP80
      run: |
        cd /www/server/mdserver-web/plugins/php && sudo bash install.sh install 80
    - name: Install PHP81
      run: |
        cd /www/server/mdserver-web/plugins/php && sudo bash install.sh install 81
    - name: Start DEBUG
      run: |
        cd /www/server/mdserver-web/web && sudo ../bin/python3 -m gunicorn -c setting.py app:app
        cd /www/server/mdserver-web && sudo ./bin/python3 panel_task.py &
