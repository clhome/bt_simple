# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: YF APP MySQL57

# 触发策略（报告 P1 第 9 条：CI 自动化程度低）：保留手动触发，另加 push / PR 自动触发，
# 但用 paths 收窄到「本插件目录 + 本 workflow 文件」。依据：这个 workflow 的实际动作是
# `sudo bash scripts/install_dev.sh` 装整套面板，再用 `plugins/mysql/install.sh install 5.7`
# **真装一次 MySQL 5.7**，属重型集成冒烟（Ubuntu 22.04 × 全套安装）。每次提交都跑既慢
# 又没必要；只有 MySQL 插件本体或本 workflow 自身改动才可能影响它的结论。
# 守卫：testsuite/test_ci_workflows_hardening.py
on:
  workflow_dispatch:
  push:
    paths:
      - 'plugins/mysql/**'
      - '.github/workflows/python-app-mysql57.yml'
  pull_request:
    paths:
      - 'plugins/mysql/**'
      - '.github/workflows/python-app-mysql57.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        # 2026-10-23：ubuntu-18.04（2023-04 下线）与 ubuntu-20.04（2025-04 下线）
        # 已被 GitHub 托管 runner 移除，写了这两个标签的矩阵会在「分配 runner」阶段
        # 直接失败（与安装脚本无关的红）。只保留仍受支持的 22.04 LTS。
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    #runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    # 为什么要先清理镜像自带的 MySQL（2026-10-27）：
    #   GitHub 托管的 ubuntu-22.04 镜像**预装 MySQL 8.0.x**（root/root，默认 disabled），
    #   而本插件的 systemd unit 也叫 mysql.service（写到 /lib/systemd/system/mysql.service）。
    #   两套 MySQL 并存时，只要 unit 覆盖没生效（模板读不到 / 写失败 / daemon-reload 未生效）、
    #   或 apt 又把包里的 unit 恢复回来，`systemctl start mysql` 起的就是系统那套，
    #   面板 ORM 连上去就是 1045 (using password: YES) —— 「装完假成功、其实连不到自己的库」。
    #   CI 里环境干净比保留无用组件重要：停掉 + 卸掉，让插件成为机器上唯一的 MySQL。
    #   守卫：testsuite/test_ci_workflows_hardening.py（不得用 `|| true` 掩盖失败，故全部走 if 判定）
    - name: 清理镜像预装的 MySQL 8.0（避免端口 / mysql.service 名冲突）
      run: |
        set -e
        if systemctl is-active --quiet mysql.service; then sudo systemctl stop mysql.service; fi
        if systemctl is-enabled --quiet mysql.service; then sudo systemctl disable mysql.service; fi
        _pkgs=""
        for _p in mysql-server mysql-server-8.0 mysql-server-core-8.0; do
          if dpkg-query -W -f='${Status}' "$_p" 2>/dev/null | grep -q 'install ok installed'; then
            _pkgs="$_pkgs $_p"
          fi
        done
        if [ -n "$_pkgs" ]; then
          echo "卸载镜像预装包：$_pkgs"
          sudo DEBIAN_FRONTEND=noninteractive apt-get purge -y $_pkgs
        fi
        sudo rm -rf /var/lib/mysql /etc/mysql
        sudo systemctl daemon-reload
        if ss -ltn | grep -q ':3306 '; then
          echo "::error::清理后 3306 仍被占用，插件实例无法监听"
          ss -ltnp | grep 3306
          exit 1
        fi
        if [ -e /usr/sbin/mysqld ]; then
          echo "::error::/usr/sbin/mysqld 仍在 —— 镜像自带的 MySQL 没卸干净"
          exit 1
        fi
        echo "镜像自带 MySQL 已清理：无 /usr/sbin/mysqld、3306 空闲"
    - name: Install YFPanel
      run: |
        sudo bash scripts/install_dev.sh
    - name: Install MySQL57
      run: |
        cd /www/server/yufeng_panel/plugins/mysql && sudo bash install.sh install 5.7
    # 冒烟：面板必须真的「在跑 + 能应答」才算绿，不是「敲了启动命令就算绿」。
    #
    # 旧写法有两处致命点（2026-10-23 的运行：MySQL55/56/57 的 Start DEBUG 全部退出码 127）：
    #   ① `cd web` 是相对路径，依赖 runner 的当前目录 —— 而当前目录是 checkout 目录，
    #      不是面板目录 /www/server/yufeng_panel；
    #   ② 裸 `gunicorn` 不在 PATH 上 —— 面板的 Python 环境在 /www/server/yufeng_panel/bin
    #      （venv，由 scripts/lib.sh 创建），setup-python 装出来的解释器里没有 gunicorn，
    #      于是 command not found。
    # 另外 setting.py 里是 `daemon=True`：启动命令 double-fork 后立刻返回 0，
    # 「命令没报错」不代表进程活着（端口占用之类的失败都发生在子进程里）。所以这里只认
    # `/healthz` 真的回 200 —— 它同时校验面板库结构完整 + data 目录可写
    # （见 web/admin/__init__.py::healthz），比 `ps` 断言更难糊弄。
    # 后台任务队列（panel_task.py）已由 install_dev.sh → cli.sh start 拉起过一次，
    # 这里不再重复启动，避免两个任务循环抢同一份锁。
    - name: 面板健康冒烟（/healthz）
      run: |
        set -e
        PANEL=/www/server/yufeng_panel
        if ! sudo test -f "$PANEL/data/port.pl"; then
          echo "::error::找不到 $PANEL/data/port.pl —— 面板从未成功启动过"
          exit 1
        fi
        PORT=$(sudo cat "$PANEL/data/port.pl")
        echo "面板端口：$PORT"
        for i in $(seq 1 60); do
          : > /tmp/yf_healthz.json
          code=$(curl -s -o /tmp/yf_healthz.json -w '%{http_code}' --max-time 5 "http://127.0.0.1:${PORT}/healthz") || code=000
          if [ "$code" = "200" ]; then
            cat /tmp/yf_healthz.json
            echo
            echo "面板健康检查通过（第 ${i} 次探测，HTTP 200）"
            exit 0
          fi
          echo "第 ${i} 次探测：HTTP ${code} $(cat /tmp/yf_healthz.json 2>/dev/null)"
          sleep 1
        done
        echo "::error::面板端口 ${PORT} 在 60s 内没有通过 /healthz（最后一次 HTTP ${code}）"
        sudo tail -n 60 "$PANEL/logs/panel_error.log" || echo "（读不到 panel_error.log）"
        exit 1
