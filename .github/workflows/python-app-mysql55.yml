# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: MW APP MySQL55

# 触发策略（报告 P1 第 9 条：CI 自动化程度低）：保留手动触发，另加 push / PR 自动触发，
# 但用 paths 收窄到「本插件目录 + 本 workflow 文件」。依据：这个 workflow 的实际动作是
# `sudo bash scripts/install_dev.sh` 装整套面板，再用 `plugins/mysql/install.sh install 5.5`
# **真装一次 MySQL 5.5**，属重型集成冒烟（matrix 3 个 OS × 全套安装）。每次提交都跑既慢
# 又没必要；只有 MySQL 插件本体或本 workflow 自身改动才可能影响它的结论。
# 守卫：testsuite/test_ci_workflows_hardening.py
on:
  workflow_dispatch:
  push:
    paths:
      - 'plugins/mysql/**'
      - '.github/workflows/python-app-mysql55.yml'
  pull_request:
    paths:
      - 'plugins/mysql/**'
      - '.github/workflows/python-app-mysql55.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-20.04, ubuntu-18.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    #runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install MW
      run: |
        sudo bash scripts/install_dev.sh
    - name: Install MySQL55
      run: |
        cd /www/server/mdserver-web/plugins/mysql && sudo bash install.sh install 5.5
    - name: Start DEBUG
      run: |
        cd web && gunicorn -c setting.py app:app
        python3 panel_task.py &
